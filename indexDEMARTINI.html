<style>
:root {
  --bg: #f5f1e8;
  --card: #fffdf8;
  --ink: #1d2a24;
  --muted: #66746c;
  --line: #e4ddcc;
  --accent: #1f5f4a;
  --accent-ink: #ffffff;
  --rocio: #f0b3c7;
  --rocio-ink: #6d2340;
  --nacho: #a6d0ee;
  --nacho-ink: #174a6e;
  --ok: #2f8a5f;
  --warn: #c98a14;
  --bad: #b3402f;
  --radius: 18px;
  --shadow: 0 1px 0 rgba(29, 42, 36, .04), 0 8px 24px -14px rgba(29, 42, 36, .25);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131a17;
    --card: #1b2420;
    --ink: #eef2ee;
    --muted: #9aa9a1;
    --line: #2b3832;
    --accent: #4fb28c;
    --accent-ink: #0c1612;
    --rocio: #7b3b53;
    --rocio-ink: #ffd6e3;
    --nacho: #27526f;
    --nacho-ink: #d3ebfb;
    --ok: #55c08c;
    --warn: #e0a83a;
    --bad: #ee7b69;
    --shadow: none;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.app { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 14px; }

.top { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 6px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.1; letter-spacing: -.02em; }
h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.form { display: grid; gap: 16px; }

svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; font-size: 22px; line-height: 1; }
.icon-btn.small { width: 36px; height: 36px; }
.icon-btn:active { transform: scale(.94); }

fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Quién */
.who { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.who-btn {
  min-height: 52px; border-radius: 14px; border: 2px solid transparent; font-weight: 700; font-size: 17px; cursor: pointer;
  background: color-mix(in srgb, var(--line) 60%, transparent); color: var(--muted);
}
.who-btn[data-who="rocio"][aria-pressed="true"] { background: var(--rocio); color: var(--rocio-ink); border-color: var(--rocio-ink); }
.who-btn[data-who="nacho"][aria-pressed="true"] { background: var(--nacho); color: var(--nacho-ink); border-color: var(--nacho-ink); }

/* Categoría */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat-btn {
  display: grid; gap: 4px; justify-items: center; padding: 12px 6px; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--line); background: transparent; color: var(--ink); font-weight: 600; font-size: 14px;
}
.cat-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Campos */
.field { display: grid; gap: 6px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.lbl em { font-weight: 400; font-style: normal; }
input[type="text"], input[type="url"], input[type="password"], input[type="date"] {
  width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; font-size: 17px;
}
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.amount-wrap { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); padding: 0 14px; }
.amount-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.cur { font-size: 28px; color: var(--muted); font-weight: 600; }
#monto { border: 0; background: transparent; font-size: 36px; font-weight: 700; letter-spacing: -.02em; min-height: 66px; padding: 0; font-variant-numeric: tabular-nums; box-shadow: none; }
#monto:focus { box-shadow: none; }
.hint { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.hint.center { text-align: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip:active { background: var(--line); }

/* Botones */
.btn-primary {
  min-height: 58px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
  font-size: 18px; font-weight: 700; cursor: pointer; letter-spacing: -.01em;
}
.btn-primary.slim { min-height: 46px; font-size: 16px; padding: 0 18px; }
.btn-primary:active { transform: translateY(1px); filter: brightness(.95); }
.btn-primary:disabled { opacity: .55; cursor: progress; }
.btn-ghost { min-height: 46px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 0 16px; cursor: pointer; }

.status { margin: -6px 0 0; min-height: 1.3em; font-size: 14px; text-align: center; color: var(--muted); }
.status.ok { color: var(--ok); font-weight: 600; }
.status.err { color: var(--bad); font-weight: 600; }
.status.wait { color: var(--warn); font-weight: 600; }

.banner { background: color-mix(in srgb, var(--warn) 16%, var(--card)); border: 1px solid var(--warn); border-radius: 14px; padding: 10px 14px; font-size: 14px; display: grid; gap: 6px; }
.banner button { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 4px 0; cursor: pointer; }
.banner .row { display: flex; gap: 14px; flex-wrap: wrap; }

/* Resumen */
.sum-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sum-cards { display: grid; gap: 12px; }
.sc { display: grid; gap: 6px; padding: 12px; border-radius: 14px; background: var(--bg); }
.sc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sc-name { font-weight: 700; }
.sc-nums { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.sc-nums b { color: var(--ink); font-size: 17px; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--ok); width: 0; transition: width .4s ease; }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.sc-left { font-size: 13px; font-weight: 600; }
.sc-left.ok { color: var(--ok); } .sc-left.warn { color: var(--warn); } .sc-left.bad { color: var(--bad); }
.sc-who { display: flex; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.tag { padding: 2px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; font-weight: 600; }
.tag.rocio { background: var(--rocio); color: var(--rocio-ink); }
.tag.nacho { background: var(--nacho); color: var(--nacho-ink); }

/* Movimientos */
.moves h2 { margin-bottom: 8px; }
.move-list { list-style: none; margin: 0; padding: 0; display: grid; }
.mv { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mv:first-child { border-top: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.rocio { background: var(--rocio-ink); } .dot.nacho { background: var(--nacho-ink); }
.mv-main { min-width: 0; }
.mv-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.mv-sub { font-size: 12px; color: var(--muted); }
.mv-amt { font-variant-numeric: tabular-nums; font-weight: 700; }
.mv-del { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 8px; cursor: pointer; border-radius: 10px; min-width: 44px; min-height: 36px; }
.mv-del.armed { background: var(--bad); color: #fff; font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0 0; }

/* Ajustes */
dialog { border: 1px solid var(--line); border-radius: 20px; padding: 0; width: min(92vw, 440px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.dlg-body { padding: 18px; display: grid; gap: 14px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 10px; }

.skeleton { height: 78px; border-radius: 14px; background: linear-gradient(90deg, var(--bg), var(--line), var(--bg)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .bar > i { transition: none; } }
</style>
</head>
<body>
<main class="app" id="app">

  <header class="top">
    <div>
      <p class="eyebrow">Familia De Martini · Eraso</p>
      <h1>Cargar gasto</h1>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="queue-banner" class="banner" hidden></div>

  <form id="form" class="card form" autocomplete="off" novalidate>

    <fieldset class="who" aria-label="Quién gastó">
      <button type="button" class="who-btn" data-who="rocio" aria-pressed="false">Rocío</button>
      <button type="button" class="who-btn" data-who="nacho" aria-pressed="false">Nacho</button>
    </fieldset>

    <fieldset class="cats" aria-label="Categoría">
      <button type="button" class="cat-btn" data-cat="super" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L19 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
        <span>Súper</span>
      </button>
      <button type="button" class="cat-btn" data-cat="nafta" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15"/><path d="M4 20h11"/><path d="M7 8h5"/><path d="M14 9h2.2a1.8 1.8 0 0 1 1.8 1.8V16a1.5 1.5 0 0 0 3 0V9l-2.5-2.5"/></svg>
        <span>Nafta</span>
      </button>
      <button type="button" class="cat-btn" data-cat="salidas" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-.6 6.2a3.4 3.4 0 0 1-6.8 0L8 3z"/><path d="M12 12.6V20"/><path d="M8.5 20h7"/></svg>
        <span>Salidas</span>
      </button>
    </fieldset>

    <label class="field amount">
      <span class="lbl">Monto</span>
      <div class="amount-wrap">
        <span class="cur">$</span>
        <input id="monto" type="text" inputmode="decimal" enterkeyhint="next" placeholder="0" aria-describedby="monto-preview">
      </div>
      <span id="monto-preview" class="hint" aria-live="polite">&nbsp;</span>
    </label>

    <label class="field">
      <span class="lbl">Concepto <em>(opcional)</em></span>
      <input id="concepto" type="text" maxlength="80" enterkeyhint="done" placeholder="Ej: Carrefour, Axion, cena…">
      <div id="chips" class="chips" aria-label="Sugerencias"></div>
    </label>

    <label class="field">
      <span class="lbl">Fecha</span>
      <input id="fecha" type="date">
      <span id="fecha-hint" class="hint"></span>
    </label>

    <button class="btn-primary" id="btn-save" type="submit">Guardar gasto</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </form>

  <section class="card summary" aria-labelledby="sum-title">
    <div class="sum-head">
      <button class="icon-btn small" id="m-prev" aria-label="Mes anterior">‹</button>
      <h2 id="sum-title">—</h2>
      <button class="icon-btn small" id="m-next" aria-label="Mes siguiente">›</button>
    </div>
    <p id="sum-note" class="hint center" hidden></p>
    <div id="sum-cards" class="sum-cards"></div>
  </section>

  <section class="card moves" aria-labelledby="mov-title">
    <h2 id="mov-title">Últimos movimientos</h2>
    <ul id="moves" class="move-list"></ul>
  </section>

  <p class="foot">Lo que cargues acá aparece en tu planilla en 1–2 segundos.</p>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlg-form" class="dlg-body">
    <h2>Ajustes</h2>
    <label class="field">
      <span class="lbl">URL del script</span>
      <input id="set-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" spellcheck="false">
    </label>
    <label class="field">
      <span class="lbl">PIN</span>
      <input id="set-pin" type="password" inputmode="text" autocomplete="off" placeholder="El que pusiste en el script">
    </label>
    <p id="dlg-msg" class="hint"></p>
    <div class="dlg-actions">
      <button type="button" class="btn-ghost" id="dlg-cancel">Cerrar</button>
      <button type="submit" class="btn-primary slim" id="dlg-save" value="save">Guardar y probar</button>
    </div>
  </form>
</dialog>

<script>
// ====== PEGÁ ACÁ LA URL DE TU SCRIPT (la que termina en /exec) ======
// Si la dejás vacía, la app te la pide la primera vez en el engranaje de Ajustes.
window.APP_CONFIG = { SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxOfXiGXeapUvtkb5afaLb0Cuul_1IpawTEsl084-2Qtsp1rKd-r2IkglvXq8iCAAVXLw/exec" };
</script>
<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const CFG = window.APP_CONFIG || {};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const CATS = { super: 'Súper', nafta: 'Nafta', salidas: 'Salidas' };
const WHO = { rocio: 'Rocío', nacho: 'Nacho' };
const SUGERENCIAS = {
  super: ['Carrefour', 'Disco', 'Verdulería', 'Carnicería', 'Dietética', 'Farmacia'],
  nafta: ['Axion', 'YPF', 'Shell', 'Puma'],
  salidas: ['Restaurante', 'Delivery', 'Café', 'Cine', 'Helado']
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('gf.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gf.' + k, JSON.stringify(v)); } catch { /* modo privado */ } }
};

const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
const money = (n) => fmt.format(Math.round(n || 0));

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const pad = (n) => String(n).padStart(2, '0');
function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

function parseMonto(s) {
  s = String(s).trim().replace(/[$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

/* ---------- estado ---------- */
const now = new Date();
const state = {
  who: store.get('who', null),
  cat: store.get('cat', 'super'),
  url: store.get('url', '') || CFG.SCRIPT_URL || '',
  pin: store.get('pin', ''),
  queue: store.get('queue', []),
  hist: store.get('hist', { super: [], nafta: [], salidas: [] }),
  view: { y: now.getFullYear(), m: now.getMonth() + 1 },
  sending: false,
  flushing: false
};

/* ---------- API ---------- */
class ApiError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }

async function api(payload) {
  if (!state.url || !state.pin) throw new ApiError('config', 'Falta configurar la URL y el PIN (engranaje de arriba).');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 30000);
  let res;
  try {
    res = await fetch(state.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight CORS
      body: JSON.stringify({ ...payload, pin: state.pin }),
      signal: ctl.signal
    });
  } catch (e) {
    throw new ApiError('network', 'Sin conexión');
  } finally { clearTimeout(t); }
  let data;
  try { data = await res.json(); } catch {
    throw new ApiError('server', 'El script no respondió bien. Revisá que esté publicado con acceso "Cualquier persona".');
  }
  if (!data.ok) throw new ApiError('server', data.error || 'Error desconocido');
  return data;
}

/* ---------- UI: formulario ---------- */
const el = {
  monto: $('#monto'), concepto: $('#concepto'), fecha: $('#fecha'), chips: $('#chips'),
  preview: $('#monto-preview'), fechaHint: $('#fecha-hint'), status: $('#status'), save: $('#btn-save'),
  banner: $('#queue-banner'), sumTitle: $('#sum-title'), sumNote: $('#sum-note'), sumCards: $('#sum-cards'),
  moves: $('#moves'), dlg: $('#dlg')
};

function setStatus(msg, kind = '') { el.status.textContent = msg; el.status.className = 'status ' + kind; }

function paintToggles() {
  $$('.who-btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.who === state.who)));
  $$('.cat-btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat)));
}

function paintChips() {
  const recent = state.hist[state.cat] || [];
  const list = [...recent, ...SUGERENCIAS[state.cat].filter((s) => !recent.includes(s))].slice(0, 6);
  el.chips.replaceChildren(...list.map((s) => h('button', { type: 'button', class: 'chip', onclick: () => { el.concepto.value = s; el.concepto.focus(); } }, s)));
}

function paintFechaHint() {
  const m = /^\d{4}-(\d{2})-\d{2}$/.exec(el.fecha.value);
  el.fechaHint.textContent = m ? `Se guarda en la solapa ${MESES[+m[1] - 1].toUpperCase()}` : '';
}

$$('.who-btn').forEach((b) => b.addEventListener('click', () => { state.who = b.dataset.who; store.set('who', state.who); paintToggles(); }));
$$('.cat-btn').forEach((b) => b.addEventListener('click', () => { state.cat = b.dataset.cat; store.set('cat', state.cat); paintToggles(); paintChips(); }));
el.fecha.addEventListener('change', paintFechaHint);

el.monto.addEventListener('input', () => {
  const clean = el.monto.value.replace(/[^\d.,]/g, '');
  if (clean !== el.monto.value) el.monto.value = clean;
  const n = parseMonto(clean);
  el.preview.textContent = Number.isFinite(n) && n > 0 ? '= ' + money(n) : ' ';
});

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.sending) return;
  const monto = parseMonto(el.monto.value);
  if (!state.who) return setStatus('Elegí quién gastó (Rocío o Nacho).', 'err');
  if (!(monto > 0)) { el.monto.focus(); return setStatus('Poné un monto mayor a 0.', 'err'); }
  if (!el.fecha.value) return setStatus('Elegí la fecha.', 'err');

  const entry = { id: uid(), cat: state.cat, who: state.who, date: el.fecha.value, concepto: el.concepto.value.trim(), monto };
  state.sending = true; el.save.disabled = true; setStatus('Guardando…', 'wait');
  try {
    const r = await api({ action: 'add', ...entry });
    recordHist(entry);
    const hoja = r.sheet ? r.sheet.split(' ')[0] : '';
    setStatus(`Listo ✓ ${CATS[entry.cat]} ${money(monto)}${hoja ? ' → ' + hoja : ''}`, 'ok');
    resetForm();
    afterSaved(entry);
  } catch (err) {
    if (err.kind === 'network') {
      state.queue.push(entry); store.set('queue', state.queue); recordHist(entry);
      setStatus('Sin señal: lo guardé en el celu y lo envío solo cuando vuelva.', 'wait');
      resetForm(); paintQueue();
    } else {
      setStatus(err.message, 'err');
    }
  } finally {
    state.sending = false; el.save.disabled = false;
  }
});

function resetForm() { el.monto.value = ''; el.concepto.value = ''; el.preview.textContent = ' '; el.monto.focus(); }

function recordHist(entry) {
  if (!entry.concepto) return;
  const list = state.hist[entry.cat].filter((x) => x.toLowerCase() !== entry.concepto.toLowerCase());
  list.unshift(entry.concepto);
  state.hist[entry.cat] = list.slice(0, 6);
  store.set('hist', state.hist); paintChips();
}

function afterSaved(entry) {
  const mm = +entry.date.slice(5, 7);
  if (mm === state.view.m) loadSummary();
}

/* ---------- cola offline ---------- */
function paintQueue() {
  const pend = state.queue.filter((q) => !q.err);
  const failed = state.queue.filter((q) => q.err);
  if (!state.queue.length) { el.banner.hidden = true; el.banner.replaceChildren(); return; }
  const kids = [];
  if (pend.length) {
    kids.push(h('div', {}, `⏳ ${pend.length} gasto${pend.length > 1 ? 's' : ''} esperando señal para enviarse.`));
    kids.push(h('button', { type: 'button', onclick: flushQueue }, 'Reintentar ahora'));
  }
  failed.forEach((q) => kids.push(h('div', { class: 'row' },
    h('span', {}, `⚠️ ${CATS[q.cat]} ${money(q.monto)} (${q.date.slice(8)}/${q.date.slice(5, 7)}): ${q.err}`),
    h('button', { type: 'button', onclick: () => { state.queue = state.queue.filter((x) => x.id !== q.id); store.set('queue', state.queue); paintQueue(); } }, 'Descartar'))));
  el.banner.replaceChildren(...kids); el.banner.hidden = false;
}

async function flushQueue() {
  if (state.flushing) return;
  state.flushing = true;
  try {
    for (const q of state.queue.filter((x) => !x.err)) {
      try {
        await api({ action: 'add', ...q });
        state.queue = state.queue.filter((x) => x.id !== q.id);
      } catch (err) {
        if (err.kind === 'network') break;
        q.err = err.message;
      }
      store.set('queue', state.queue);
    }
  } finally {
    state.flushing = false; paintQueue(); loadSummary();
  }
}

/* ---------- resumen del mes ---------- */
const sumKey = () => `sum.${state.view.y}-${state.view.m}`;

function paintTitle() { el.sumTitle.textContent = `${MESES[state.view.m - 1]} ${state.view.y}`; }

async function loadSummary() {
  paintTitle();
  const cached = store.get(sumKey(), null);
  if (cached) paintSummary(cached); else el.sumCards.replaceChildren(h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' }));
  el.sumNote.hidden = true;
  if (!state.url || !state.pin) return;
  const asked = sumKey();
  try {
    const r = await api({ action: 'summary', month: state.view.m });
    if (asked !== sumKey()) return; // el usuario ya cambió de mes
    store.set(asked, r.summary); paintSummary(r.summary);
  } catch (err) {
    if (asked !== sumKey()) return;
    el.sumNote.hidden = false;
    if (err.kind === 'network') el.sumNote.textContent = cached ? 'Sin conexión · mostrando lo último que se vio.' : 'Sin conexión.';
    else { el.sumNote.textContent = err.message; if (!cached) el.sumCards.replaceChildren(); }
    if (!cached) el.moves.replaceChildren(h('li', { class: 'empty' }, 'Sin datos para mostrar.'));
  }
}

function paintSummary(sum) {
  el.sumCards.replaceChildren(...Object.keys(CATS).map((k) => {
    const d = sum[k];
    if (!d) return h('div', { class: 'sc' }, h('span', { class: 'sc-name' }, CATS[k]), h('span', { class: 'hint' }, 'No encontré este bloque en la solapa.'));
    const budget = d.budget.rocio + d.budget.nacho, real = d.real.rocio + d.real.nacho;
    const pct = budget > 0 ? real / budget : 0;
    const cls = pct > 1 ? 'bad' : pct >= 0.85 ? 'warn' : '';
    const left = budget <= 0 ? ['Sin presupuesto cargado', ''] :
      real <= budget ? [`Te quedan ${money(budget - real)}`, cls || 'ok'] : [`Te pasaste ${money(real - budget)}`, 'bad'];
    const bar = h('div', { class: 'bar ' + cls }, h('i', { style: `width:${Math.min(100, pct * 100).toFixed(1)}%` }));
    return h('div', { class: 'sc' },
      h('div', { class: 'sc-top' }, h('span', { class: 'sc-name' }, CATS[k]),
        h('span', { class: 'sc-nums' }, h('b', {}, money(real)), ' de ', money(budget))),
      bar,
      h('div', { class: 'sc-top' }, h('span', { class: 'sc-left ' + left[1] }, left[0]),
        h('span', { class: 'sc-who' }, h('span', { class: 'tag rocio' }, 'Ro ' + money(d.real.rocio)), h('span', { class: 'tag nacho' }, 'Na ' + money(d.real.nacho)))));
  }));
  paintMoves(sum);
}

function paintMoves(sum) {
  const all = [];
  for (const k of Object.keys(CATS)) if (sum[k]) sum[k].items.forEach((it) => all.push({ ...it, cat: k }));
  const key = (it) => { const m = /^(\d{2})\/(\d{2})$/.exec(it.fecha); return m ? +m[2] * 100 + +m[1] : 0; };
  all.sort((a, b) => key(b) - key(a) || b.row - a.row);
  if (!all.length) { el.moves.replaceChildren(h('li', { class: 'empty' }, 'Todavía no hay gastos cargados este mes.')); return; }
  el.moves.replaceChildren(...all.slice(0, 20).map((it) => {
    const who = it.rocio && !it.nacho ? 'rocio' : it.nacho && !it.rocio ? 'nacho' : 'rocio';
    const whoTxt = it.rocio && it.nacho ? 'Rocío + Nacho' : WHO[who];
    return h('li', { class: 'mv' },
      h('span', { class: 'dot ' + who }),
      h('div', { class: 'mv-main' }, h('div', { class: 'mv-title' }, it.concepto || CATS[it.cat]),
        h('div', { class: 'mv-sub' }, `${CATS[it.cat]} · ${it.fecha || 's/f'} · ${whoTxt}`)),
      h('span', { class: 'mv-amt' }, money(it.rocio + it.nacho)),
      deleteBtn(it));
  }));
}

function deleteBtn(it) {
  const b = h('button', { type: 'button', class: 'mv-del', 'aria-label': 'Borrar ' + (it.concepto || 'movimiento') }, 'Borrar');
  let timer = null;
  b.addEventListener('click', async () => {
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = '¿Seguro?';
      timer = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Borrar'; }, 3000);
      return;
    }
    clearTimeout(timer); b.disabled = true; b.textContent = '…';
    try {
      await api({ action: 'delete', cat: it.cat, month: state.view.m, row: it.row, concepto: it.concepto });
      setStatus('Movimiento borrado de la planilla.', 'ok'); loadSummary();
    } catch (err) {
      b.disabled = false; b.classList.remove('armed'); b.textContent = 'Borrar';
      setStatus(err.message, 'err');
    }
  });
  return b;
}

$('#m-prev').addEventListener('click', () => shiftMonth(-1));
$('#m-next').addEventListener('click', () => shiftMonth(1));
function shiftMonth(d) {
  let m = state.view.m + d, y = state.view.y;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  state.view = { y, m }; loadSummary();
}

/* ---------- ajustes ---------- */
function openSettings(msg = '') {
  $('#set-url').value = state.url; $('#set-pin').value = state.pin;
  $('#dlg-msg').textContent = msg;
  if (!el.dlg.open) el.dlg.showModal();
}
$('#btn-settings').addEventListener('click', () => openSettings());
$('#dlg-cancel').addEventListener('click', () => el.dlg.close());
$('#dlg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('#set-url').value.trim(), pin = $('#set-pin').value.trim();
  const msg = $('#dlg-msg');
  if (!/^https:\/\//.test(url) || !pin) { msg.textContent = 'Completá la URL (https://…) y el PIN.'; return; }
  state.url = url; state.pin = pin; store.set('url', url); store.set('pin', pin);
  msg.textContent = 'Probando conexión…';
  try {
    await api({ action: 'ping' });
    msg.textContent = 'Conectado ✓'; setTimeout(() => el.dlg.close(), 500);
    loadSummary(); flushQueue();
  } catch (err) {
    msg.textContent = err.kind === 'network' ? 'No pude conectarme. Revisá la URL y tu señal.' : err.message;
  }
});

/* ---------- arranque ---------- */
el.fecha.value = hoyISO();
paintToggles(); paintChips(); paintFechaHint(); paintQueue();
loadSummary();
if (!state.url || !state.pin) openSettings('Primera vez: pegá la URL del script y tu PIN. Se guardan sólo en este celu.');
else if (state.queue.some((q) => !q.err)) flushQueue();
window.addEventListener('online', () => { flushQueue(); loadSummary(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadSummary(); if (state.queue.length) flushQueue(); } });

})();

</script>
</body>
</html>
